# grafana-dashboard.yaml
# Platform-wide Grafana dashboard — cluster health, all services overview.
# Applied by setup-observability.sh. Grafana sidecar picks it up automatically.
# Individual service dashboards are generated by configure-monitoring.sh.

apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-overview-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: k8s-platform
    app.kubernetes.io/component: observability
data:
  platform-overview.json: |
    {
      "title": "Platform Overview",
      "uid": "platform-overview",
      "tags": ["platform", "overview"],
      "timezone": "browser",
      "refresh": "15s",
      "schemaVersion": 36,
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Total Running Pods",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [{
            "expr": "count(kube_pod_info{namespace=\"apps\"})",
            "legendFormat": "pods"
          }],
          "options": {"colorMode": "background", "graphMode": "none"}
        },
        {
          "id": 2, "type": "stat", "title": "Services Onboarded",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [{
            "expr": "count(kube_deployment_info{namespace=\"apps\"})",
            "legendFormat": "services"
          }],
          "options": {"colorMode": "background", "graphMode": "none"}
        },
        {
          "id": 3, "type": "stat", "title": "Platform Request Rate (5m)",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [{
            "expr": "sum(rate(http_requests_total{namespace=\"apps\"}[5m]))",
            "legendFormat": "req/s"
          }],
          "options": {"colorMode": "background", "graphMode": "area"}
        },
        {
          "id": 4, "type": "stat", "title": "Platform Error Rate (5m)",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "targets": [{
            "expr": "sum(rate(http_requests_total{namespace=\"apps\",status=~\"5..\"}[5m]))",
            "legendFormat": "err/s"
          }],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [{"color": "green","value": 0},{"color": "red","value": 0.01}]
              }
            }
          },
          "options": {"colorMode": "background"}
        },
        {
          "id": 5, "type": "timeseries", "title": "Request Rate per Service",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 4},
          "targets": [{
            "expr": "sum(rate(http_requests_total{namespace=\"apps\"}[5m])) by (service)",
            "legendFormat": "{{service}}"
          }],
          "fieldConfig": {"defaults": {"unit": "reqps"}}
        },
        {
          "id": 6, "type": "timeseries", "title": "Memory per Service",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [{
            "expr": "sum(container_memory_working_set_bytes{namespace=\"apps\",container!=\"\"}) by (pod)",
            "legendFormat": "{{pod}}"
          }],
          "fieldConfig": {"defaults": {"unit": "bytes"}}
        },
        {
          "id": 7, "type": "timeseries", "title": "CPU per Service",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [{
            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"apps\",container!=\"\"}[5m])) by (pod)",
            "legendFormat": "{{pod}}"
          }],
          "fieldConfig": {"defaults": {"unit": "short"}}
        },
        {
          "id": 8, "type": "table", "title": "Deployment Status",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 20},
          "targets": [{
            "expr": "kube_deployment_status_replicas_ready{namespace=\"apps\"}",
            "legendFormat": "{{deployment}}",
            "instant": true,
            "format": "table"
          },{
            "expr": "kube_deployment_spec_replicas{namespace=\"apps\"}",
            "legendFormat": "{{deployment}}",
            "instant": true,
            "format": "table"
          }],
          "options": {"sortBy": [{"displayName": "deployment"}]}
        }
      ]
    }
