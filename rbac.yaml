# rbac.yaml
# Least-privilege RBAC for the platform components.
# No service-specific roles here — per-service RBAC is generated by onboard.sh.

---
# ── ServiceAccount: platform controller (runs onboard/build scripts in-cluster if needed) ──
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-controller
  namespace: platform
  labels:
    app.kubernetes.io/part-of: k8s-platform
    app.kubernetes.io/component: controller

---
# ── ClusterRole: platform controller permissions ──────────────────────────────
# Allowed to manage Deployments, Services, ConfigMaps, Secrets, Jobs, and
# ServiceAccounts only within the apps namespace (bound below via RoleBinding,
# not ClusterRoleBinding — principle of least privilege).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-controller
  labels:
    app.kubernetes.io/part-of: k8s-platform
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "serviceaccounts", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# ── RoleBinding: bind controller to apps namespace only ──────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-controller
  namespace: apps
  labels:
    app.kubernetes.io/part-of: k8s-platform
subjects:
  - kind: ServiceAccount
    name: platform-controller
    namespace: platform
roleRef:
  kind: ClusterRole
  name: platform-controller
  apiGroup: rbac.authorization.k8s.io

---
# ── RoleBinding: bind controller to platform namespace ───────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-controller
  namespace: platform
  labels:
    app.kubernetes.io/part-of: k8s-platform
subjects:
  - kind: ServiceAccount
    name: platform-controller
    namespace: platform
roleRef:
  kind: ClusterRole
  name: platform-controller
  apiGroup: rbac.authorization.k8s.io

---
# ── Role: read-only access for dashboard (Phase 3) ───────────────────────────
# Minimal permissions the dashboard backend will need.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-reader
  labels:
    app.kubernetes.io/part-of: k8s-platform
    app.kubernetes.io/component: dashboard
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "pods", "pods/log", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]

---
# ── ServiceAccount: dashboard (Phase 3 placeholder — applied now so RBAC is ready) ──
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-dashboard
  namespace: platform
  labels:
    app.kubernetes.io/part-of: k8s-platform
    app.kubernetes.io/component: dashboard

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-dashboard-reader
  namespace: apps
  labels:
    app.kubernetes.io/part-of: k8s-platform
subjects:
  - kind: ServiceAccount
    name: platform-dashboard
    namespace: platform
roleRef:
  kind: ClusterRole
  name: platform-reader
  apiGroup: rbac.authorization.k8s.io
